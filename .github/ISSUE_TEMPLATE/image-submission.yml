name: 图片投稿
description: 提交由 March7ths 上传页面生成的图片投稿包
title: "[图片投稿] "
labels:
  - image-submission
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 March7ths 画廊带来新的星光。

        请先在网站的“上传”页面填写图片信息并下载整合 ZIP，然后在下方上传该文件。公开仓库中的附件可以被任何人访问，请勿包含隐私信息。
  - type: upload
    id: submission-package
    attributes:
      label: 投稿 ZIP
      description: 仅上传由 March7ths 网站生成、大小不超过 25 MB 的 ZIP。
    validations:
      required: true
      accept: ".zip"
  - type: checkboxes
    id: confirmations
    attributes:
      label: 投稿确认
      options:
        - label: 我确认投稿包内的图片可用于本站非商业展示与下载。
          required: true
        - label: 我理解并承担由本次投稿引发的版权责任。
          required: true
        - label: 我确认投稿包中不包含隐私信息或可执行代码。
          required: true
